<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIKUSI by K&K — NOTHING LIMITED COLLECTION</title>
  <meta name="description" content="АБСОЛЮТНО НИЧЕГО. ИМЕННО ТО, ЧТО ТЕБЕ НУЖНО. Лимитированная концептуальная коллекция от VIKUSI by K&K.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#080808',
            brandCard: '#111111',
            brandBorder: '#222222',
            brandSilver: '#E5E5E5',
            brandGray: '#888888',
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #080808;
      color: #E5E5E5;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #080808;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #222222;
    }
  </style>
</head>
<body class="custom-scrollbar antialiased selection:bg-white selection:text-black min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // База данных 6 продуктов NOTHING COLLECTION (Каждый по 9,99 €)
    const PRODUCTS = [
      {
        id: 'nothing-bottle',
        slug: 'bottle',
        nameEn: 'NOTHING BOTTLE — LIMITED COLLECTION',
        nameRu: 'Бутылка с абсолютно ничем',
        badgeOnItem: 'АБСОЛЮТНО НИЧЕГО',
        price: 9.99,
        images: ['nothing_bottle.jpg'],
        shortDesc: 'Знакомая форма. Неожиданное содержание. Вернее, его полное отсутствие.',
        fullDesc: 'NOTHING BOTTLE — объект из лимитированной коллекции VIKUSI by K&K. Создан для тех, кто ценит форму больше содержимого и понимает, что иногда лучший ответ — это пустота.\n\nВнутри? Абсолютно ничего.\nИменно так и задумано.',
        specs: { volume: '0 ml / Content: 0%', material: 'Metal / Chrome finish', edition: 'Limited' }
      },
      {
        id: 'nothing-box',
        slug: 'box',
        nameEn: 'NOTHING BOX — LIMITED COLLECTION',
        nameRu: 'Коробка с абсолютно ничем',
        badgeOnItem: 'АБСОЛЮТНО НИЧЕГО',
        price: 9.99,
        images: ['nothing_box.jpg'],
        shortDesc: 'Самое интересное в этой коробке — то, чего в ней нет.',
        fullDesc: 'NOTHING BOX — минималистичный объект с максимальной концепцией. Идеальное воплощение идеи о том, что упаковка иногда становится важнее содержимого.\n\nОткрой её. Загляни внутрь. Убедись лично.\nТам абсолютно ничего.',
        specs: { volume: 'Empty Space', material: 'Black Matte Cardboard', edition: 'Limited' }
      },
      {
        id: 'nothing-shot',
        slug: 'shot',
        nameEn: 'NOTHING SHOT — LIMITED COLLECTION',
        nameRu: 'Рюмки с абсолютно ничем',
        badgeOnItem: 'АБСОЛЮТНО НИЧЕГО',
        price: 9.99,
        images: ['nothing_shot.jpg'],
        shortDesc: 'Маленький объект. Большая пустота.',
        fullDesc: 'NOTHING SHOT — часть NOTHING COLLECTION, в которой даже самые привычные предметы получают совершенно новое значение.\n\nМинимализм, который можно держать в руках.\nСодержимое не входит в концепцию. Потому что его нет.',
        specs: { volume: '0 ml', material: 'Heavy Glass', edition: 'Limited' }
      },
      {
        id: 'nothing-carry-set',
        slug: 'carry-set',
        nameEn: 'NOTHING CARRY SET — LIMITED COLLECTION',
        nameRu: 'Пакет и ведро с абсолютно ничем',
        badgeOnItem: 'АБСОЛЮТНО НИЧЕГО',
        price: 9.99,
        images: ['nothing_carry_set.jpg'], // Одна совместная фотография пакета и ведра
        isSet: true,
        shortDesc: 'Для тех случаев, когда тебе буквально нечего переносить.',
        fullDesc: 'NOTHING CARRY SET объединяет два повседневных объекта в одну концептуальную композицию: пакет и ведро, в которых нет абсолютно ничего.\n\nОдин набор. Два объекта. Ноль содержимого.\nФункциональность остаётся предметом интерпретации.',
        specs: { volume: '0 L Total', material: 'Reinforced Polymer / Metal', itemsInSet: '1x Bag, 1x Bucket' }
      },
      {
        id: 'nothing-jar',
        slug: 'jar',
        nameEn: 'NOTHING JAR — LIMITED COLLECTION',
        nameRu: 'Баночка с абсолютно ничем',
        badgeOnItem: 'АБСОЛЮТНО НИЧЕГО',
        price: 9.99,
        images: ['nothing_jar.jpg'],
        shortDesc: 'Мы взяли классическую форму баночки и убрали главную причину её существования — содержимое.',
        fullDesc: 'NOTHING JAR — объект для тех, кто понимает эстетику пустоты. Лаконичная форма, фирменная надпись и никакого лишнего смысла.\n\nОткрой. Посмотри. Закрой.\nВнутри ничего не изменится. Там ничего нет.',
        specs: { volume: '0 ml', material: 'Dark Glass / Aluminium Lid', edition: 'Limited' }
      },
      {
        id: 'nothing-deo',
        slug: 'deo',
        nameEn: 'NOTHING DEO — LIMITED COLLECTION',
        nameRu: 'Дезодорант с абсолютно ничем',
        badgeOnItem: 'АБСОЛЮТНО НИЧЕГО',
        price: 9.99,
        images: ['nothing_deo.jpg', 'nothing_deo_2.jpg'], // Галерея из 2 фотографий дезодоранта
        shortDesc: 'Привычный формат. Непривычная концепция.',
        fullDesc: 'NOTHING DEO — предмет из лимитированной коллекции VIKUSI by K&K. Никаких громких обещаний, никаких лишних деталей и никакого содержимого.\n\nМы не продаём эффективность. Мы продаём идею.\nАбсолютно ничего. В абсолютно узнаваемой форме.',
        specs: { volume: '0 ml', material: 'Matte Black Case', gallery: '2 Views Included' }
      }
    ];

    function App() {
      const [currentRoute, setCurrentRoute] = useState('home');
      const [selectedProductId, setSelectedProductId] = useState('nothing-bottle');
      const [activeImgIndex, setActiveImgIndex] = useState(0);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const navigateTo = (route) => {
        setCurrentRoute(route);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openProductPage = (id) => {
        setSelectedProductId(id);
        setActiveImgIndex(0);
        setCurrentRoute('product');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const addToCart = (product, qty = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + qty } : item);
          }
          return [...prev, { ...product, qty }];
        });
        showToast(`«${product.nameRu}» добавлен в корзину`);
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const totalCartPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const totalCartCount = cart.reduce((sum, item) => sum + item.qty, 0);

      const currentProduct = PRODUCTS.find(p => p.id === selectedProductId) || PRODUCTS[0];

      return (
        <div class="min-h-screen flex flex-col justify-between bg-brandDark text-brandSilver font-sans">
          
          {/* Уведомление */}
          {toastMsg && (
            <div class="fixed bottom-6 right-6 z-50 bg-white text-black text-xs font-semibold px-6 py-3 tracking-widest uppercase border border-white shadow-2xl flex items-center gap-3">
              <span>●</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* ВЕРХНЯЯ СТРОКА */}
          <div class="bg-black text-[10px] tracking-[0.3em] uppercase py-2 text-center text-neutral-400 border-b border-brandBorder">
            NOTHING COLLECTION — LIMITED RELEASE · CONTENT: 0% · 100% NOTHING
          </div>

          {/* ШАПКА САЙТА */}
          <header class="sticky top-0 z-40 bg-brandDark/90 backdrop-blur-md border-b border-brandBorder">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
              
              <button onClick={() => navigateTo('home')} class="text-left group">
                <div class="font-serif text-lg tracking-[0.25em] font-semibold text-white group-hover:text-neutral-400 transition">
                  VIKUSI <span class="text-[10px] tracking-[0.2em] font-sans font-light text-neutral-500">by K&K</span>
                </div>
                <div class="text-[9px] tracking-[0.4em] text-neutral-500 uppercase">
                  NOTHING COLLECTION
                </div>
              </button>

              <nav class="hidden md:flex items-center gap-10 text-[11px] tracking-[0.25em] font-medium text-neutral-400 uppercase">
                <button onClick={() => navigateTo('home')} class={`hover:text-white transition ${currentRoute === 'home' ? 'text-white border-b border-white pb-1' : ''}`}>
                  HOME
                </button>
                <button onClick={() => navigateTo('collection')} class={`hover:text-white transition ${currentRoute === 'collection' ? 'text-white border-b border-white pb-1' : ''}`}>
                  COLLECTION
                </button>
                <button onClick={() => navigateTo('about')} class={`hover:text-white transition ${currentRoute === 'about' ? 'text-white border-b border-white pb-1' : ''}`}>
                  ABOUT
                </button>
                <button onClick={() => navigateTo('contact')} class={`hover:text-white transition ${currentRoute === 'contact' ? 'text-white border-b border-white pb-1' : ''}`}>
                  CONTACT
                </button>
              </nav>

              <button 
                onClick={() => setIsCartOpen(true)}
                class="relative border border-brandBorder hover:border-neutral-500 text-white px-5 py-2.5 flex items-center gap-3 transition text-[11px] tracking-[0.2em] uppercase font-medium bg-black"
              >
                <span>CART</span>
                <span class="text-neutral-500">[{totalCartCount}]</span>
              </button>
            </div>

            <div class="md:hidden flex justify-around py-2 border-t border-brandBorder text-[10px] tracking-[0.2em] uppercase text-neutral-400 bg-black">
              <button onClick={() => navigateTo('home')} class={currentRoute === 'home' ? 'text-white font-bold' : ''}>HOME</button>
              <button onClick={() => navigateTo('collection')} class={currentRoute === 'collection' ? 'text-white font-bold' : ''}>COLLECTION</button>
              <button onClick={() => navigateTo('about')} class={currentRoute === 'about' ? 'text-white font-bold' : ''}>ABOUT</button>
              <button onClick={() => navigateTo('contact')} class={currentRoute === 'contact' ? 'text-white font-bold' : ''}>CONTACT</button>
            </div>
          </header>

          <main class="flex-grow">
            
            {/* 1. ГЛАВНАЯ СТРАНИЦА */}
            {currentRoute === 'home' && (
              <div>
                <section class="relative min-h-[85vh] flex items-center justify-center border-b border-brandBorder py-20 px-6 overflow-hidden">
                  <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-16 items-center z-10">
                    <div class="space-y-8">
                      <div class="inline-block border border-brandBorder bg-black px-4 py-1.5 text-[10px] tracking-[0.3em] uppercase text-neutral-400">
                        LIMITED RELEASE · 2026
                      </div>
                      <h1 class="font-serif text-6xl sm:text-7xl lg:text-8xl font-normal tracking-tight text-white leading-none">
                        NOTHING.
                      </h1>
                      <p class="text-neutral-300 text-lg font-light leading-relaxed max-w-md">
                        Абсолютно ничего. Лимитированная коллекция от VIKUSI by K&K.
                      </p>
                      <p class="text-neutral-500 text-xs tracking-wider uppercase">
                        «Мы не продаём содержимое. Мы продаём саму идею.»
                      </p>
                      <div>
                        <button 
                          onClick={() => navigateTo('collection')}
                          class="bg-white text-black hover:bg-neutral-200 px-10 py-5 text-xs font-semibold tracking-[0.3em] uppercase transition rounded-none border border-white"
                        >
                          EXPLORE THE NOTHING
                        </button>
                      </div>
                    </div>

                    <div class="relative bg-brandCard border border-brandBorder p-8 aspect-square flex items-center justify-center overflow-hidden group">
                      <img 
                        src="nothing_bottle.jpg" 
                        alt="NOTHING BOTTLE" 
                        class="w-full h-full object-contain relative z-10 group-hover:scale-105 transition duration-700 filter contrast-125"
                        onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=800&q=80'; }}
                      />
                      <div class="absolute bottom-6 left-6 z-20 text-[10px] tracking-[0.25em] text-neutral-400 uppercase bg-black/80 backdrop-blur px-3 py-1.5 border border-brandBorder">
                        ITEM 01/06 · NOTHING BOTTLE
                      </div>
                    </div>
                  </div>
                </section>

                <section class="py-28 border-b border-brandBorder bg-black text-center px-6">
                  <div class="max-w-3xl mx-auto space-y-6">
                    <span class="text-[10px] tracking-[0.4em] text-neutral-500 uppercase">THE CONCEPT</span>
                    <h2 class="font-serif text-3xl sm:text-5xl tracking-widest text-white">ЧТО ВНУТРИ?</h2>
                    <div class="font-serif text-6xl sm:text-8xl text-white font-extrabold tracking-widest py-4">
                      НИЧЕГО.
                    </div>
                    <p class="text-neutral-400 text-base font-light tracking-wide italic">
                      И мы не пытаемся это скрывать.
                    </p>
                    <p class="text-neutral-500 text-xs sm:text-sm leading-relaxed max-w-xl mx-auto pt-4 font-light">
                      В мире, где каждый пытается продать тебе больше, мы решили предложить меньше. Намного меньше. Фактически — ноль.
                    </p>
                  </div>
                </section>

                <section class="py-24 max-w-7xl mx-auto px-6">
                  <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 pb-6 border-b border-brandBorder">
                    <div>
                      <span class="text-[10px] tracking-[0.3em] text-neutral-500 uppercase">CATALOGUE</span>
                      <h2 class="font-serif text-4xl text-white mt-2">THE COLLECTION</h2>
                    </div>
                    <p class="text-neutral-500 text-xs tracking-widest uppercase mt-4 md:mt-0">
                      Ограниченный выпуск. Неограниченная пустота.
                    </p>
                  </div>

                  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                    {PRODUCTS.map((prod, idx) => (
                      <div 
                        key={prod.id}
                        onClick={() => openProductPage(prod.id)}
                        class="group cursor-pointer bg-brandCard border border-brandBorder hover:border-neutral-500 p-6 flex flex-col justify-between transition duration-500"
                      >
                        <div>
                          <div class="relative bg-black aspect-square mb-6 overflow-hidden flex items-center justify-center p-4 border border-brandBorder/50">
                            <img 
                              src={prod.images[0]} 
                              alt={prod.nameEn}
                              class="w-full h-full object-contain group-hover:scale-105 transition duration-500 filter contrast-125"
                              onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=600&q=80'; }}
                            />
                            <div class="absolute top-3 left-3 text-[9px] tracking-[0.2em] bg-black text-neutral-400 px-2.5 py-1 uppercase border border-brandBorder">
                              {prod.badgeOnItem}
                            </div>
                            {prod.images.length > 1 && (
                              <div class="absolute bottom-3 right-3 text-[9px] tracking-[0.2em] bg-neutral-900 text-white px-2 py-1 uppercase border border-brandBorder">
                                2 VIEWS
                              </div>
                            )}
                          </div>

                          <div class="text-[10px] tracking-[0.25em] text-neutral-500 uppercase mb-1">0{idx + 1} / 06</div>
                          <h3 class="font-serif text-xl text-white group-hover:text-neutral-300 transition mb-1">
                            {prod.nameEn}
                          </h3>
                          <div class="text-xs text-neutral-400 mb-3 font-light">
                            «{prod.nameRu}»
                          </div>
                          <p class="text-neutral-500 text-xs font-light line-clamp-2 leading-relaxed mb-6">
                            {prod.shortDesc}
                          </p>
                        </div>

                        <div class="pt-4 border-t border-brandBorder flex items-center justify-between">
                          <span class="font-mono text-lg text-white font-medium">
                            {prod.price.toFixed(2)} €
                          </span>
                          <span class="text-[10px] tracking-[0.2em] text-neutral-400 uppercase group-hover:text-white transition">
                            VIEW OBJECT →
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {/* 2. КАТАЛОГ */}
            {currentRoute === 'collection' && (
              <div class="max-w-7xl mx-auto px-6 py-16">
                <div class="mb-16 border-b border-brandBorder pb-8 text-center md:text-left">
                  <span class="text-[10px] tracking-[0.3em] text-neutral-500 uppercase">CATALOGUE</span>
                  <h1 class="font-serif text-4xl sm:text-6xl text-white mt-2">NOTHING COLLECTION</h1>
                  <p class="text-neutral-400 text-xs tracking-widest uppercase mt-3">6 CONCEPTUAL OBJECTS · 9,99 € EACH</p>
                </div>

                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                  {PRODUCTS.map((prod) => (
                    <div key={prod.id} class="bg-brandCard border border-brandBorder p-6 flex flex-col justify-between">
                      <div>
                        <div 
                          onClick={() => openProductPage(prod.id)}
                          class="cursor-pointer bg-black aspect-square mb-6 overflow-hidden flex items-center justify-center p-4 border border-brandBorder/50"
                        >
                          <img 
                            src={prod.images[0]} 
                            alt={prod.nameEn}
                            class="w-full h-full object-contain hover:scale-105 transition duration-500 filter contrast-125"
                            onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=600&q=80'; }}
                          />
                        </div>
                        <h3 
                          onClick={() => openProductPage(prod.id)}
                          class="font-serif text-xl text-white hover:text-neutral-300 cursor-pointer mb-1"
                        >
                          {prod.nameEn}
                        </h3>
                        <p class="text-xs text-neutral-400 mb-3">{prod.nameRu}</p>
                        <p class="text-neutral-500 text-xs font-light mb-6 line-clamp-2">{prod.shortDesc}</p>
                      </div>

                      <div class="pt-4 border-t border-brandBorder space-y-3">
                        <div class="flex justify-between items-center font-mono text-lg text-white">
                          <span>{prod.price.toFixed(2)} €</span>
                          <span class="text-[10px] text-neutral-500 font-sans tracking-widest">CONTENT: 0%</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                          <button 
                            onClick={() => openProductPage(prod.id)}
                            class="border border-brandBorder text-neutral-300 hover:text-white hover:border-neutral-400 py-2.5 text-[10px] tracking-[0.2em] uppercase font-semibold transition"
                          >
                            DETAILS
                          </button>
                          <button 
                            onClick={() => addToCart(prod)}
                            class="bg-white text-black hover:bg-neutral-200 py-2.5 text-[10px] tracking-[0.2em] uppercase font-semibold transition"
                          >
                            ADD TO CART
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. СТРАНИЦА ТОВАРА */}
            {currentRoute === 'product' && (
              <div class="max-w-7xl mx-auto px-6 py-16">
                <button 
                  onClick={() => navigateTo('collection')}
                  class="text-[10px] tracking-[0.3em] uppercase text-neutral-500 hover:text-white mb-12 inline-block transition"
                >
                  ← BACK TO COLLECTION
                </button>

                <div class="grid md:grid-cols-2 gap-16 items-start">
                  <div class="space-y-4">
                    <div class="bg-brandCard border border-brandBorder p-8 aspect-square flex items-center justify-center relative">
                      <img 
                        src={currentProduct.images[activeImgIndex]} 
                        alt={currentProduct.nameEn}
                        class="w-full h-full object-contain filter contrast-125"
                        onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=800&q=80'; }}
                      />
                      <div class="absolute top-4 left-4 text-[9px] tracking-[0.2em] bg-black text-neutral-400 px-3 py-1 uppercase border border-brandBorder">
                        {currentProduct.badgeOnItem}
                      </div>
                    </div>

                    {/* Галерея переключения фото (для дезодоранта и других товаров с 2+ фото) */}
                    {currentProduct.images.length > 1 && (
                      <div class="flex gap-4">
                        {currentProduct.images.map((img, i) => (
                          <button 
                            key={i}
                            onClick={() => setActiveImgIndex(i)}
                            class={`w-24 h-24 bg-brandCard border p-2 ${activeImgIndex === i ? 'border-white' : 'border-brandBorder opacity-60'}`}
                          >
                            <img src={img} alt="" class="w-full h-full object-contain" onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=300&q=80'; }} />
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  <div class="space-y-8">
                    <div>
                      <span class="text-[10px] tracking-[0.3em] uppercase text-neutral-500">VIKUSI by K&K · LIMITED RELEASE</span>
                      <h1 class="font-serif text-3xl sm:text-5xl text-white mt-2 mb-1">
                        {currentProduct.nameEn}
                      </h1>
                      <div class="text-sm text-neutral-400 font-light mb-4">
                        «{currentProduct.nameRu}»
                      </div>
                      <div class="font-mono text-3xl text-white font-medium">
                        {currentProduct.price.toFixed(2)} €
                      </div>
                    </div>

                    <div class="border-y border-brandBorder py-6 space-y-4">
                      <p class="text-neutral-300 text-sm leading-relaxed font-light whitespace-pre-line">
                        {currentProduct.fullDesc}
                      </p>
                    </div>

                    <div class="space-y-4 pt-2">
                      <button 
                        onClick={() => addToCart(currentProduct)}
                        class="w-full bg-white text-black hover:bg-neutral-200 py-5 text-xs font-semibold tracking-[0.3em] uppercase transition rounded-none border border-white"
                      >
                        ADD TO CART — {currentProduct.price.toFixed(2)} €
                      </button>
                    </div>

                    <div class="bg-black border border-brandBorder p-6 space-y-3 text-xs">
                      <div class="text-[10px] tracking-[0.2em] uppercase text-neutral-500 mb-2">OBJECT SPECIFICATIONS</div>
                      {Object.entries(currentProduct.specs).map(([key, val]) => (
                        <div key={key} class="flex justify-between border-b border-brandBorder/50 pb-2 text-neutral-400 font-mono">
                          <span class="capitalize text-neutral-600">{key}:</span>
                          <span class="text-neutral-200">{val}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 4. О БРЕНДЕ */}
            {currentRoute === 'about' && (
              <div class="max-w-4xl mx-auto px-6 py-20">
                <span class="text-[10px] tracking-[0.4em] uppercase text-neutral-500">PHILOSOPHY</span>
                <h1 class="font-serif text-4xl sm:text-6xl text-white mt-2 mb-12">ABOUT THE COLLECTION</h1>

                <div class="space-y-8 border-l border-brandBorder pl-8 text-neutral-300 font-light leading-relaxed text-base">
                  <p>
                    <strong class="text-white font-medium">NOTHING</strong> — это эксперимент с формой, смыслом и потребительскими привычками. Мы превращаем отсутствие содержимого в главный элемент дизайна.
                  </p>
                  <p>
                    VIKUSI by K&K представляет NOTHING — лимитированную коллекцию предметов, в которых содержание уступает место форме.
                  </p>
                  <div class="p-6 bg-black border border-brandBorder text-white font-serif text-lg tracking-wide my-8">
                    «Никаких обещаний. Никаких излишеств. Никакого содержимого. Только объект, дизайн и идея.»
                  </div>
                </div>
              </div>
            )}

            {/* 5. КОНТАКТЫ */}
            {currentRoute === 'contact' && (
              <div class="max-w-2xl mx-auto px-6 py-20 text-center">
                <span class="text-[10px] tracking-[0.4em] uppercase text-neutral-500">INQUIRIES</span>
                <h1 class="font-serif text-4xl sm:text-5xl text-white mt-2 mb-12">CONTACT</h1>

                <div class="bg-brandCard border border-brandBorder p-10 text-left space-y-8 font-light text-sm">
                  <div>
                    <div class="text-[10px] tracking-[0.2em] text-neutral-500 uppercase mb-1">BRAND HOLDER</div>
                    <div class="text-white font-serif text-xl">VIKUSI by K&K</div>
                  </div>
                  <div>
                    <div class="text-[10px] tracking-[0.2em] text-neutral-500 uppercase mb-1">PRESS & ORDERS</div>
                    <div class="text-neutral-300 font-mono">nothing@vikusi-kk.com</div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* КОРЗИНА */}
          {isCartOpen && (
            <div class="fixed inset-0 z-50 overflow-hidden">
              <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
              <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
                <div class="w-screen max-w-md bg-brandDark border-l border-brandBorder flex flex-col justify-between">
                  <div class="p-6 border-b border-brandBorder flex items-center justify-between bg-black">
                    <h2 class="font-serif text-xl text-white tracking-wider">YOUR CART</h2>
                    <button onClick={() => setIsCartOpen(false)} class="text-neutral-500 hover:text-white text-lg">✕</button>
                  </div>

                  <div class="flex-grow overflow-y-auto p-6 space-y-4">
                    {cart.length === 0 ? (
                      <div class="text-center py-20 text-neutral-600 text-xs tracking-widest uppercase">
                        YOUR CART IS EMPTY
                      </div>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} class="bg-brandCard p-4 border border-brandBorder flex gap-4 items-center">
                          <img src={item.images[0]} alt="" class="w-14 h-14 object-contain bg-black p-1" onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=300&q=80'; }} />
                          <div class="flex-grow">
                            <h4 class="font-serif text-sm text-white">{item.nameEn}</h4>
                            <div class="font-mono text-xs text-neutral-400">{item.price.toFixed(2)} €</div>
                            <div class="flex items-center gap-3 mt-2">
                              <button onClick={() => updateQty(item.id, -1)} class="w-6 h-6 border border-brandBorder text-xs text-white">-</button>
                              <span class="text-xs font-mono text-white">{item.qty}</span>
                              <button onClick={() => updateQty(item.id, 1)} class="w-6 h-6 border border-brandBorder text-xs text-white">+</button>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {cart.length > 0 && (
                    <div class="p-6 bg-black border-t border-brandBorder space-y-4">
                      <div class="flex justify-between items-center font-mono text-lg text-white">
                        <span>TOTAL:</span>
                        <span>{totalCartPrice.toFixed(2)} €</span>
                      </div>
                      <button 
                        onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
                        class="w-full bg-white text-black py-4 text-xs font-semibold tracking-[0.3em] uppercase hover:bg-neutral-200 transition"
                      >
                        CHECKOUT
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ДЕМО ОФОРМЛЕНИЕ */}
          {isCheckoutOpen && (
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
              <div class="bg-brandDark border border-brandBorder p-8 max-w-md w-full text-center space-y-6">
                <div class="font-serif text-2xl text-white">CHECKOUT</div>
                <p class="text-xs text-neutral-400 font-light leading-relaxed">
                  Сайт работает в демонстрационном режиме арт-проекта. Все 6 предметов доступны по цене 9,99 €.
                </p>
                <div class="p-4 bg-black border border-brandBorder text-left font-mono text-xs space-y-2 text-neutral-300">
                  <div class="flex justify-between"><span>ITEMS:</span> <span>{totalCartCount}</span></div>
                  <div class="flex justify-between text-white font-bold"><span>TOTAL:</span> <span>{totalCartPrice.toFixed(2)} €</span></div>
                </div>
                <button 
                  onClick={() => setIsCheckoutOpen(false)}
                  class="w-full border border-white text-white py-3 text-xs tracking-[0.2em] uppercase font-semibold"
                >
                  CLOSE
                </button>
              </div>
            </div>
          )}

          <footer class="bg-black border-t border-brandBorder py-16 text-neutral-500 text-xs">
            <div class="max-w-7xl mx-auto px-6 text-center space-y-4">
              <div class="font-serif text-lg text-white">VIKUSI by K&K</div>
              <p class="text-neutral-600 font-light">© 2026 VIKUSI by K&K · NOTHING COLLECTION</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
